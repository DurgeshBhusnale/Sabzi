name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile || pnpm install
      - run: pnpm verify

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Supabase project
        id: check
        run: |
          if [ -f supabase/config.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.present == 'true'
        with:
          version: latest
      - if: steps.check.outputs.present == 'true'
        run: supabase start
      - if: steps.check.outputs.present == 'true'
        run: supabase db reset
      - if: steps.check.outputs.present == 'true'
        run: supabase test db
